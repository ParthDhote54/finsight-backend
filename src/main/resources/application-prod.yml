spring:
  datasource:
    url: jdbc:postgresql:///${DB_NAME:finsight}?cloudSqlInstance=${CLOUD_SQL_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory&ipTypes=PRIVATE,PUBLIC
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:3}
      minimum-idle: ${HIKARI_MIN_IDLE:0}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  ai:
    vertex:
      ai:
        gemini:
          project-id: ${GCP_PROJECT_ID:finsight-ai-dev}
          location: ${GCP_LOCATION:asia-south1}
          chat:
            options:
              model: ${FINSIGHT_GEMINI_MODEL:gemini-2.5-flash-lite}
              temperature: 0.2
        embedding:
          project-id: ${GCP_PROJECT_ID:finsight-ai-dev}
          location: ${GCP_LOCATION:asia-south1}
          options:
            model: text-embedding-004

server:
  port: ${PORT:8080}

finsight:
  frontend:
    origin: ${FINSIGHT_FRONTEND_ORIGIN:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
